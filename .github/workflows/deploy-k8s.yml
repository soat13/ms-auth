name: Deploy to Kubernetes

on:
  workflow_call:
    secrets:
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_SESSION_TOKEN:
        required: true
      K8S_JWT_SECRET:
        required: true

jobs:
  k8s-deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: us-east-1

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@56d6a583f00f6bad6d19d91d53a7bc3b8143d0e9
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fetch Terraform Outputs
        id: tf_outputs
        run: |
          aws s3 cp s3://soatfiap-4/state/oficina-infra/terraform.tfstate infra.tfstate

          CLUSTER_NAME=$(jq -r '.outputs.cluster_name.value' infra.tfstate)

          echo "cluster_name=${CLUSTER_NAME}" >> $GITHUB_OUTPUT

      - name: Update Kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name "${{ steps.tf_outputs.outputs.cluster_name }}" \
            --region ${{ env.AWS_REGION }}

      - name: Apply Namespace and Base Resources
        run: |
          kubectl apply -f deploy/k8s/namespace.yaml
          kubectl apply -f deploy/k8s/auth-sa.yaml
          envsubst < deploy/k8s/configmap.yaml | kubectl apply -f -

      - name: Apply Kubernetes Secret
        env:
          JWT_SECRET: ${{ secrets.K8S_JWT_SECRET }}
        run: |
          envsubst < deploy/k8s/secrets.yaml | kubectl apply -f -

      - name: Deploy Application
        run: |
          kubectl apply -f deploy/k8s/metric-server.yaml
          kubectl apply -f deploy/k8s/app.yaml
          kubectl apply -f deploy/k8s/services.yaml
          kubectl apply -f deploy/k8s/hpa.yaml

      - name: Wait for Deployment Rollout
        run: |
          kubectl rollout restart deployment/oficina-auth -n fiap
