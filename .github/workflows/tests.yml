name: Tests

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        required: true

jobs:
  tests-and-quality:
    name: Tests & Quality
    runs-on: ubuntu-latest
    env:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oficina
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    services:
      db:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: oficina
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.1'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Create .env.testing
        run: |
          cat <<EOF > .env.testing
          PG_DSN=postgres://postgres:postgres@127.0.0.1:5432/oficina?sslmode=disable
          MIGRATIONS_DIR=scripts/db/migrations
          TEST_SEEDERS_DIR=scripts/db/test_seeders
          EOF

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Run tests with coverage (unit + integration)
        run: |
          go test -v \
            -coverpkg=./internal/... \
            -coverprofile=coverage.out \
            ./...

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@fd88b7d7ccbaefd23d8f36f73b59db7a3d246602
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.go.coverage.reportPaths=coverage.out
