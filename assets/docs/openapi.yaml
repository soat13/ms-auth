openapi: "3.0.3"
info:
  title: Oficina Auth API
  version: 1.0.0
  description: |-
    API de Autenticação e Gestão de Usuários.

    Utilize `POST /auth/login` para obter um token JWT e, em seguida, informe `Bearer <token>` no cabeçalho `Authorization` ao chamar as rotas protegidas. No Swagger UI, use o botão **Authorize** para registrar o token.
servers:
  - url: /
    description: Servidor atual
security:
  - bearerAuth: []
tags:
  - name: Auth
    description: Fluxo de autenticação e emissão de tokens JWT.
  - name: Users
    description: Administração de usuários internos.
paths:
  /auth/login:
    post:
      tags: [ Auth ]
      summary: Autenticar usuário
      description: Retorna um token JWT válido para acessar as rotas protegidas.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            example:
              cpf: "58457673009"
              password: "TestPass123!"
      responses:
        "200":
          description: Autenticação realizada com sucesso.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Corpo JSON inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "400"
                message: invalid JSON body
        "401":
          description: Credenciais inválidas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "401"
                message: invalid credentials
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"

  /admin/users:
    get:
      tags: [ Users ]
      summary: Listar usuários
      parameters:
        - $ref: "#/components/parameters/LimitParam"
        - $ref: "#/components/parameters/OffsetParam"
      responses:
        "200":
          description: Lista de usuários.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
    post:
      tags: [ Users ]
      summary: Criar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreateRequest"
      responses:
        "201":
          description: Usuário criado.
        "400":
          description: Corpo JSON inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "400"
                message: invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "409":
          description: Usuário duplicado (documento ou email já existente).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                duplicateDocument:
                  value:
                    code: "409"
                    message: user with this document already exists
                duplicateEmail:
                  value:
                    code: "409"
                    message: user with this email already exists
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"

  /admin/users/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceIdParam"
    get:
      tags: [ Users ]
      summary: Obter usuário por ID
      responses:
        "200":
          description: Usuário encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: ID inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "400"
                message: invalid ID
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "404"
                message: user not found
    patch:
      tags: [ Users ]
      summary: Atualizar usuário
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdateRequest"
      responses:
        "204":
          description: Usuário atualizado.
        "400":
          description: ID inválido ou corpo JSON inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                invalidId:
                  value:
                    code: "400"
                    message: invalid ID
                invalidJson:
                  value:
                    code: "400"
                    message: invalid JSON body
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "404"
                message: user not found
        "409":
          description: Email duplicado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: user with this email already exists
                message: "409"
        "422":
          $ref: "#/components/responses/UnprocessableEntityResponse"
    delete:
      tags: [ Users ]
      summary: Remover usuário
      responses:
        "204":
          description: Usuário removido.
        "400":
          description: ID inválido.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "400"
                message: invalid ID
        "401":
          $ref: "#/components/responses/UnauthorizedResponse"
        "404":
          description: Usuário não encontrado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              example:
                code: "404"
                message: user not found

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    LimitParam:
      name: limit
      in: query
      description: Número máximo de registros a retornar.
      schema:
        type: integer
        minimum: 1
        default: 50
    OffsetParam:
      name: offset
      in: query
      description: Quantidade de registros a ignorar antes de retornar resultados.
      schema:
        type: integer
        minimum: 0
        default: 0
    ResourceIdParam:
      name: id
      in: path
      required: true
      description: Identificador do recurso.
      schema:
        type: string
        format: uuid
  responses:
    UnauthorizedResponse:
      description: Token ausente, inválido ou expirado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            missingToken:
              value:
                code: "401"
                message: missing authorization token
            invalidToken:
              value:
                code: "401"
                message: invalid token
            expiredToken:
              value:
                code: "401"
                message: token expired
    InvalidJSONResponse:
      description: Corpo JSON inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    UnprocessableEntityResponse:
      description: Entidade não processável (erros de validação ou regras de negócio).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationError"
    InvalidIDResponse:
      description: Identificador inválido.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFoundResponse:
      description: Recurso não encontrado.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ConflictResponse:
      description: Conflito (recurso duplicado ou operação inválida).
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Error:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: string
          example: INVALID_JSON
        message:
          type: string
          example: invalid JSON body
    IdResponse:
      type: object
      required: [ id ]
      properties:
        id:
          type: string
          format: uuid
          description: ID do recurso criado.
    ValidationError:
      type: object
      required: [ code, message ]
      properties:
        code:
          type: string
          example: INVALID_BODY
        message:
          type: string
          example: Body validation failed
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
                example: password
              message:
                type: string
                example: Password is a required field
    LoginRequest:
      type: object
      required: [ cpf, password ]
      properties:
        cpf:
          type: string
          description: CPF do usuário apenas números
        password:
          type: string
          minLength: 8
    AuthenticatedUser:
      type: object
      required: [ id, name, email, roles ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
          format: email
        roles:
          type: array
          items:
            type: string
    LoginResponse:
      type: object
      required: [ access_token, token_type, expires_in, expires_at, user ]
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          format: int64
          description: Tempo (em segundos) até a expiração do token.
        expires_at:
          type: string
          format: date-time
        user:
          $ref: "#/components/schemas/AuthenticatedUser"
    User:
      type: object
      required: [ id, name, document, document_type, email, phone_number, roles ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        document:
          type: string
        document_type:
          type: string
        email:
          type: string
          format: email
        phone_number:
          type: string
        roles:
          type: array
          items:
            type: string
    UserCreateRequest:
      type: object
      required: [ name, document, email, phone_number, password, roles ]
      properties:
        name:
          type: string
          minLength: 3
        document:
          type: string
          description: "CPF apenas números"
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          minLength: 8
        roles:
          type: array
          minItems: 1
          items:
            type: string
    UserUpdateRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 3
        email:
          type: string
          format: email
        phone_number:
          type: string
        password:
          type: string
          minLength: 8
        roles:
          type: array
          items:
            type: string
    UserListResponse:
      type: object
      required: [ data ]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/User"
