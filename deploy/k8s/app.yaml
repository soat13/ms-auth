apiVersion: apps/v1
kind: Deployment
metadata:
  name: oficina-auth
  namespace: fiap
  labels:
    app: oficina-auth 
    tags.datadoghq.com/env: "development"
    tags.datadoghq.com/service: "oficina-auth"
    tags.datadoghq.com/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oficina-auth
  template:
    metadata:
      labels:
        app: oficina-auth
        tags.datadoghq.com/env: "development"
        tags.datadoghq.com/service: "oficina-auth"
        tags.datadoghq.com/version: "1.0.0"
      annotations:
        ad.datadoghq.com/oficina-auth.logs: '[{"source":"go","service":"oficina-auth"}]'
    spec:
      serviceAccountName: auth-sa
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 3
      volumes:
        - name: apmsocketpath
          hostPath:
            path: /var/run/datadog/
      containers:
        - image: 409721164017.dkr.ecr.us-east-1.amazonaws.com/oficina-auth:latest
          imagePullPolicy: Always
          name: oficina-api
          ports:
          - containerPort: 8090
          resources:
            limits:
              cpu: 50m
              memory: 20Mi
              ephemeral-storage: 250Mi 
            requests:
              cpu: 20m
              memory: 20Mi
              ephemeral-storage: 250Mi
          envFrom:
            - secretRef:
                name: auth-sc
            - configMapRef:
                name: auth-config
          env:
            - name: DD_AGENT_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: DD_TRACE_AGENT_URL
              value: "unix:///var/run/datadog/apm.socket"
            - name: DD_DOGSTATSD_URL
              value: "unix:///var/run/datadog/dsd.socket"
            - name: DD_LOGS_INJECTION
              value: "true"
            - name: DD_ENV
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/env']
            - name: DD_SERVICE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/service']  
            - name: DD_VERSION
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['tags.datadoghq.com/version']
            - name: DD_TRACE_SAMPLING_RULES
              value: '[{"resource": "GET /health*", "sample_rate": 0}, {"resource": "POST /health*", "sample_rate": 0}]'      
          volumeMounts:
            - name: apmsocketpath
              mountPath: /var/run/datadog
          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
