services:
  sonarqube:
    image: sonarqube:latest
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - sonarqube_conf:/opt/sonarqube/conf
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_temp:/opt/sonarqube/temp
    ports:
      - "9000:9000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider
            http://localhost:9000/api/system/status || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ."
    healthcheck:
      test: [ "CMD", "curl", "-X", "GET", "http://localhost:8000/shell" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  app-dev:
    image: golang:1.25.1
    working_dir: /app
    volumes:
      - ./:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
    labels:
      com.datadoghq.ad.logs: "[{\"source\": \"go\", \"service\": \"oficina-auth\"}]"
    command: tail -f /dev/null
    depends_on:
      dynamodb:
        condition: service_healthy
    ports: [ "8090:8090" ]

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - ./:/usr/src
    working_dir: /usr/src
    profiles:
      - tools

volumes:
  pgdata:
  go-mod:
  go-build:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp:
