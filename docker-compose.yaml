services:
  sonarqube:
    image: sonarqube:latest
    volumes:
      - sonarqube_data:/opt/sonarqube/data
    ports:
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9000/api/system/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  dynamodb:
    image: amazon/dynamodb-local
    ports:
      - "8000:8000"
    healthcheck:
      test: [ "CMD", "curl", "-X", "GET", "http://localhost:8000/shell" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # datadog-agent:
  #   image: gcr.io/datadoghq/agent:7
  #   environment:
  #     DD_API_KEY: ${DD_API_KEY}
  #     DD_SITE: ${DD_SITE}
  #     DD_ENV: development
  #     DD_APM_ENABLED: "true"
  #     DD_LOGS_ENABLED: "true"
  #     DD_APM_NON_LOCAL_TRAFFIC: "true"
  #     DD_PROCESS_AGENT_ENABLED: "true"
  #     DD_LOGS_CONFIG_CONTAINER_COLLECT_ALL: "true"
  #   ports:
  #     - "8126:8126/tcp"
  #     - "8125:8125/udp"
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock:ro
  #     - /proc/:/host/proc/:ro
  #     - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro  
  #   healthcheck:
  #     test: ["CMD", "agent", "health"]
  #     interval: 5s
  #     timeout: 5s
  #     retries: 10
  #     start_period: 5s
      
  app-dev:
    image: golang:1.25.1
    working_dir: /app
    volumes:
      - ./:/app
      - go-mod:/go/pkg/mod
      - go-build:/root/.cache/go-build
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DYNAMODB_ENDPOINT: http://dynamodb:8000
      DD_AGENT_HOST: datadog-agent
      DD_TRACE_AGENT_PORT: "8126"
      DD_TRACE_ENABLED: "true"
      DD_SERVICE: oficina-api
      DD_ENV: development
      DD_VERSION: "1.0.0"
      DD_LOGS_INJECTION: "true"
    labels:
      com.datadoghq.ad.logs: '[{"source": "go", "service": "oficina-api"}]'  
    command: tail -f /dev/null
    depends_on:
      dynamodb:
        condition: service_healthy
      # datadog-agent:
      #   condition: service_healthy
    ports: ["8090:8090"]

  sonar-scanner:
    image: sonarsource/sonar-scanner-cli:latest
    environment:
      SONAR_TOKEN: ${SONAR_TOKEN}
      SONAR_HOST_URL: http://sonarqube:9000
    volumes:
      - ./:/usr/src
    working_dir: /usr/src
    profiles:
      - tools

volumes:
  pgdata:
  go-mod:
  go-build:
  sonarqube_conf:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
  sonarqube_temp: